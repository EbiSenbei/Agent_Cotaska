<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cotaska - 日付選択サブ画面モック</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "Meiryo", sans-serif;
      background: #f5f5f5;
      color: #333;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .mock-stage {
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 340px;
      gap: 28px;
      align-items: start;
    }
    .context-panel {
      border: 1px solid #e5e8ef;
      background: #fff;
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(30, 42, 60, 0.08);
    }
    .context-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #666;
    }
    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .meta-item-label { color: #888; white-space: nowrap; }
    .meta-date-value {
      min-width: 38px;
      color: #666;
      white-space: nowrap;
      cursor: pointer;
    }
    .meta-date-value.unset { color: #999; }
    .meta-select {
      border: 1px solid #d0d7e2;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      background: #fff;
      color: #444;
      min-width: 66px;
    }
    .due-dialog {
      width: min(340px, 100%);
      background: #242424;
      color: #f2f2f2;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.36);
      padding: 14px;
    }
    .due-dialog-shortcuts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .due-dialog-shortcut {
      border: 1px solid #414141;
      background: #2b2b2b;
      color: #fff;
      border-radius: 14px;
      padding: 8px 4px;
      min-height: 54px;
      display: grid;
      place-items: center;
      gap: 2px;
      cursor: pointer;
      font-family: inherit;
    }
    .due-dialog-shortcut:hover { background: #333; }
    .due-dialog-shortcut.is-immediate {
      border-color: rgba(74, 116, 255, 0.7);
      box-shadow: inset 0 0 0 1px rgba(74, 116, 255, 0.15);
    }
    .due-dialog-shortcut-icon { font-size: 20px; line-height: 1; }
    .due-dialog-shortcut-label { font-size: 12px; color: #c3c3c3; }
    .due-dialog-calendar { margin-top: 14px; }
    .due-dialog-calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .due-dialog-calendar-title { font-size: 15px; font-weight: 700; }
    .due-dialog-calendar-nav { display: flex; gap: 6px; }
    .due-dialog-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid #414141;
      background: #2b2b2b;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
    .due-dialog-weekdays,
    .due-dialog-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .due-dialog-weekday {
      text-align: center;
      color: #a7a7a7;
      font-size: 12px;
    }
    .due-dialog-days { margin-top: 8px; }
    .due-dialog-day {
      aspect-ratio: 1;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: #f2f2f2;
      font-size: 15px;
      cursor: pointer;
    }
    .due-dialog-day:hover { background: #323232; }
    .due-dialog-day.is-muted { color: #6d6d6d; }
    .due-dialog-day.is-today { background: #20366e; }
    .due-dialog-day.is-selected { background: #4a74ff; font-weight: 700; }
    .due-dialog-summary {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(74, 116, 255, 0.12);
      border: 1px solid rgba(74, 116, 255, 0.32);
    }
    .due-dialog-summary-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .due-dialog-summary-label {
      color: #b7c7ff;
      font-size: 12px;
      flex-shrink: 0;
    }
    .due-dialog-summary-input {
      width: 100%;
      border: 1px solid rgba(74, 116, 255, 0.25);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      padding: 8px 10px;
      font-size: 13px;
    }
    .due-dialog-time-block { margin-top: 12px; position: relative; }
    .due-dialog-time-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid #414141;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
    }
    .due-dialog-time-row:hover { background: #2b2b2b; }
    .due-dialog-time-row-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .due-dialog-time-icon { color: #4a74ff; font-size: 18px; }
    .due-dialog-time-labels {
      display: flex;
      align-items: baseline;
      gap: 8px;
      text-align: left;
    }
    .due-dialog-time-labels strong { font-size: 14px; }
    .due-dialog-time-labels span {
      color: #b7b7b7;
      font-size: 12px;
      white-space: nowrap;
    }
    .due-dialog-footer {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .due-dialog-btn {
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .due-dialog-btn--clear {
      border: 1px solid #414141;
      background: transparent;
      color: #b7b7b7;
    }
    .due-dialog-btn--ok {
      border: 1px solid transparent;
      background: linear-gradient(180deg, #4a74ff 0%, #355be0 100%);
      color: #fff;
    }
    @media (max-width: 760px) {
      body { padding: 18px; }
      .mock-stage { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="mock-stage">
    <section class="context-panel">
      <div class="context-title">タスク詳細 / メタ情報</div>
      <div class="meta-row">
        <span class="meta-item">
          <span class="meta-item-label">進捗:</span>
          <select class="meta-select">
            <option>未着</option>
            <option selected>仕掛</option>
            <option>完了</option>
          </select>
        </span>
        <span class="meta-item">
          <span class="meta-item-label">日付:</span>
          <span class="meta-date-value">3/24</span>
        </span>
        <span class="meta-item">
          <span class="meta-item-label">期限:</span>
          <span class="meta-date-value unset">未設定</span>
        </span>
        <span class="meta-item">
          <span class="meta-item-label">優先度:</span>
          <select class="meta-select" style="color:#f39c12;">
            <option>低</option>
            <option selected>中</option>
            <option>高</option>
          </select>
        </span>
      </div>
    </section>

    <section class="due-dialog" aria-label="日付選択サブ画面モック">
      <div class="due-dialog-shortcuts" aria-label="日付ショートカット">
        <button type="button" class="due-dialog-shortcut is-immediate" title="押下時に即時保存">
          <span class="due-dialog-shortcut-icon">☀</span>
          <span class="due-dialog-shortcut-label">今日</span>
        </button>
        <button type="button" class="due-dialog-shortcut is-immediate" title="押下時に即時保存">
          <span class="due-dialog-shortcut-icon">⇢</span>
          <span class="due-dialog-shortcut-label">明日</span>
        </button>
        <button type="button" class="due-dialog-shortcut is-immediate" title="押下時に即時保存">
          <span class="due-dialog-shortcut-icon">＋7</span>
          <span class="due-dialog-shortcut-label">1週間後</span>
        </button>
        <button type="button" class="due-dialog-shortcut is-immediate" title="押下時に即時保存">
          <span class="due-dialog-shortcut-icon">◐</span>
          <span class="due-dialog-shortcut-label">日付のみ</span>
        </button>
      </div>

      <div class="due-dialog-calendar">
        <div class="due-dialog-calendar-header">
          <div class="due-dialog-calendar-title">2026年6月</div>
          <div class="due-dialog-calendar-nav">
            <button type="button" class="due-dialog-icon-btn" aria-label="前月">‹</button>
            <button type="button" class="due-dialog-icon-btn" aria-label="次月">›</button>
          </div>
        </div>
        <div class="due-dialog-weekdays">
          <span class="due-dialog-weekday">日</span>
          <span class="due-dialog-weekday">月</span>
          <span class="due-dialog-weekday">火</span>
          <span class="due-dialog-weekday">水</span>
          <span class="due-dialog-weekday">木</span>
          <span class="due-dialog-weekday">金</span>
          <span class="due-dialog-weekday">土</span>
        </div>
        <div class="due-dialog-days">
          <button type="button" class="due-dialog-day is-muted">31</button>
          <button type="button" class="due-dialog-day">1</button>
          <button type="button" class="due-dialog-day is-today is-selected">2</button>
          <button type="button" class="due-dialog-day">3</button>
          <button type="button" class="due-dialog-day">4</button>
          <button type="button" class="due-dialog-day">5</button>
          <button type="button" class="due-dialog-day">6</button>
          <button type="button" class="due-dialog-day">7</button>
          <button type="button" class="due-dialog-day">8</button>
          <button type="button" class="due-dialog-day">9</button>
          <button type="button" class="due-dialog-day">10</button>
          <button type="button" class="due-dialog-day">11</button>
          <button type="button" class="due-dialog-day">12</button>
          <button type="button" class="due-dialog-day">13</button>
          <button type="button" class="due-dialog-day">14</button>
          <button type="button" class="due-dialog-day">15</button>
          <button type="button" class="due-dialog-day">16</button>
          <button type="button" class="due-dialog-day">17</button>
          <button type="button" class="due-dialog-day">18</button>
          <button type="button" class="due-dialog-day">19</button>
          <button type="button" class="due-dialog-day">20</button>
          <button type="button" class="due-dialog-day">21</button>
          <button type="button" class="due-dialog-day">22</button>
          <button type="button" class="due-dialog-day">23</button>
          <button type="button" class="due-dialog-day">24</button>
          <button type="button" class="due-dialog-day">25</button>
          <button type="button" class="due-dialog-day">26</button>
          <button type="button" class="due-dialog-day">27</button>
          <button type="button" class="due-dialog-day">28</button>
          <button type="button" class="due-dialog-day">29</button>
          <button type="button" class="due-dialog-day">30</button>
          <button type="button" class="due-dialog-day is-muted">1</button>
          <button type="button" class="due-dialog-day is-muted">2</button>
          <button type="button" class="due-dialog-day is-muted">3</button>
          <button type="button" class="due-dialog-day is-muted">4</button>
        </div>
      </div>

      <div class="due-dialog-summary">
        <div class="due-dialog-summary-row">
          <div class="due-dialog-summary-label">選択結果</div>
          <input class="due-dialog-summary-input" type="text" value="2026-06-02" />
        </div>
      </div>

      <div class="due-dialog-time-block">
        <button type="button" class="due-dialog-time-row">
          <span class="due-dialog-time-row-main">
            <span class="due-dialog-time-icon">◷</span>
            <span class="due-dialog-time-labels">
              <strong>時刻なし</strong>
              <span>時刻設定</span>
            </span>
          </span>
          <span>›</span>
        </button>
      </div>

      <div class="due-dialog-footer">
        <button type="button" class="due-dialog-btn due-dialog-btn--clear">クリア</button>
        <button type="button" class="due-dialog-btn due-dialog-btn--ok">OK</button>
      </div>
    </section>
  </main>
</body>
</html>
