name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: 20_app/.nvmrc
          cache: npm
          cache-dependency-path: 20_app/package-lock.json
      - run: npm ci
        working-directory: 20_app
      - run: npm test
        working-directory: 20_app
      - run: npm run build
        working-directory: 20_app
